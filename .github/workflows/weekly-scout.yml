name: 熱海物件週次スカウト

on:
  schedule:
    - cron: '0 0 * * 4'  # 毎週木曜日 9:00 JST (0:00 UTC)
  workflow_dispatch:

jobs:
  scout:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 依存関係インストール
        run: pip install -r scripts/requirements.txt

      - name: スカウト実行
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/scout.py

      - name: レポートをコミット・プッシュ
        run: |
          git config user.name "atami-scout[bot]"
          git config user.email "atami-scout[bot]@users.noreply.github.com"
          git add reports/
          git diff --staged --quiet || git commit -m "週次レポート: $(date +'%Y-%m-%d')"
          git push
